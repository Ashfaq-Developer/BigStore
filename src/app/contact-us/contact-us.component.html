<div class="contact-us">
    <div class="container py-5">
        <form class="contact-form" (ngSubmit)="submitForm()" [formGroup]="contactForm">
            <h2 class="text-center">Contact Us</h2>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" formControlName="name">
                <!-- <input type="text" class="form-control" id="name" name="name" formControlName="name" [ngClass]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched ? 'is-invalid' : 'is-valid'"> -->
                <div class="invalid-feedback" [class.valid-feedback]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">Please enter your valid name.</div>
                <div>{{ nameErrorMessage }}</div>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" formControlName="email">
                <div class="invalid-feedback" [class.valid-feedback]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">Please enter a valid email address.</div>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea class="form-control" id="message" name="message" rows="4"
                    formControlName="message">
                </textarea>
                <div class="invalid-feedback" [class.valid-feedback]="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">Please enter your message.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4"
                [disabled]="contactForm.invalid">Submit</button>
            <button type="submit" class="btn btn-primary btn-block mt-4 ms-2" (click)="updateFormValues()">Update form
                values</button>
        </form>
    </div>
</div>
